    <script>
        $(document).ready(function() {
            let isProcessing = false;
            let chatHistory = [];
            let hasUploadedFile = false;
            
            // File upload elements
            const fileDropArea = $('#fileDropArea');
            const fileInput = $('#fileInput');
            const fileInfo = $('#fileInfo');
            const fileName = $('#fileName');
            const fileSize = $('#fileSize');
            const uploadProgress = $('#uploadProgress');
            const progressBar = $('#progressBar');
            const progressText = $('#progressText');
            const uploadStatus = $('#uploadStatus');
            
            // Chat elements
            const chatMessages = $('#chatMessages');
            const userInput = $('#userInput');
            const sendBtn = $('#sendBtn');
            const clearBtn = $('#clearBtn');
            const charCount = $('#charCount');
            const inputHint = $('#inputHint');
            
            // Cookie utility functions
            function setCookie(name, value, days = 7) {
                const expires = new Date();
                expires.setTime(expires.getTime() + (days * 24 * 60 * 60 * 1000));
                const expiresStr = expires.toUTCString();
                document.cookie = `${name}=${encodeURIComponent(value)};expires=${expiresStr};path=/;SameSite=Lax`;
            }
            
            function getCookie(name) {
                const nameEQ = name + "=";
                const ca = document.cookie.split(';');
                for (let i = 0; i < ca.length; i++) {
                    let c = ca[i];
                    while (c.charAt(0) === ' ') c = c.substring(1, c.length);
                    if (c.indexOf(nameEQ) === 0) {
                        return decodeURIComponent(c.substring(nameEQ.length, c.length));
                    }
                }
                return null;
            }
            
            function deleteCookie(name) {
                document.cookie = `${name}=;expires=Thu, 01 Jan 1970 00:00:00 UTC;path=/;`;
            }
            
            function saveChatHistory() {
                try {
                    const limitedHistory = chatHistory.slice(-50);
                    const historyJson = JSON.stringify(limitedHistory);
                    
                    if (historyJson.length > 3500) {
                        const shorterHistory = chatHistory.slice(-25);
                        setCookie('chatHistory', JSON.stringify(shorterHistory), 7);
                    } else {
                        setCookie('chatHistory', historyJson, 7);
                    }
                } catch (error) {
                    console.warn('Failed to save chat history to cookies:', error);
                }
            }
            
            function loadChatHistoryFromCookie() {
                try {
                    const historyJson = getCookie('chatHistory');
                    if (historyJson) {
                        const parsedHistory = JSON.parse(historyJson);
                        if (Array.isArray(parsedHistory) && parsedHistory.length > 0) {
                            chatHistory = parsedHistory;
                            return true;
                        }
                    }
                } catch (error) {
                    console.warn('Failed to load chat history from cookies:', error);
                    deleteCookie('chatHistory');
                }
                return false;
            }
            
            // File Upload Functionality
            fileDropArea.click(function() {
                fileInput.click();
            });
            
            fileDropArea.on('dragover', function(e) {
                e.preventDefault();
                $(this).addClass('dragover');
            });
            
            fileDropArea.on('dragleave', function(e) {
                e.preventDefault();
                $(this).removeClass('dragover');
            });
            
            fileDropArea.on('drop', function(e) {
                e.preventDefault();
                $(this).removeClass('dragover');
                
                const files = e.originalEvent.dataTransfer.files;
                if (files.length > 0) {
                    handleFileSelection(files[0]);
                }
            });
            
            fileInput.change(function() {
                if (this.files.length > 0) {
                    handleFileSelection(this.files[0]);
                }
            });
            
            function handleFileSelection(file) {
                if (!file.name.toLowerCase().endsWith('.pdf')) {
                    showStatus('error', 'Please select a PDF file.');
                    return;
                }
                
                if (file.size > 50 * 1024 * 1024) { // 50MB limit
                    showStatus('error', 'File size must be less than 50MB.');
                    return;
                }
                
                // Update file info
                fileName.text(file.name);
                fileSize.text(formatFileSize(file.size));
                fileInfo.addClass('show');
                
                // Upload file
                uploadFile(file);
            }
            
            function uploadFile(file) {
                const formData = new FormData();
                formData.append('files', file);
                
                uploadProgress.addClass('show');
                progressBar.css('width', '0%');
                progressText.text('0%');
                
                // Simulate progress
                let progress = 0;
                const progressInterval = setInterval(() => {
                    progress += Math.random() * 15;
                    if (progress > 90) progress = 90;
                    progressBar.css('width', progress + '%');
                    progressText.text(Math.round(progress) + '%');
                }, 200);
                
                $.ajax({
                    url: '/addpdf',
                    type: 'POST',
                    data: formData,
                    processData: false,
                    contentType: false,
                    success: function(response) {
                        clearInterval(progressInterval);
                        progressBar.css('width', '100%');
                        progressText.text('100%');
                        
                        setTimeout(() => {
                            uploadProgress.removeClass('show');
                            showStatus('success', 'Document processed! You can now chat.');
                            hasUploadedFile = true;
                            enableChatInterface();
                        }, 500);
                    },
                    error: function(xhr) {
                        clearInterval(progressInterval);
                        uploadProgress.removeClass('show');
                        
                        let errorMessage = 'Failed to upload document.';
                        try {
                            const response = JSON.parse(xhr.responseText);
                            errorMessage = response.error || errorMessage;
                        } catch (e) {
                            // Use default error message
                        }
                        
                        showStatus('error', errorMessage);
                        fileInfo.removeClass('show');
                    }
                });
            }
            
            function enableChatInterface() {
                userInput.prop('disabled', false);
                sendBtn.prop('disabled', false);
                userInput.attr('placeholder', 'Ask me anything about the uploaded document...');
                // Focus and ensure proper height after enabling
                userInput.focus();
                userInput.trigger('input');
            }
            
            function formatFileSize(bytes) {
                if (bytes === 0) return '0 Bytes';
                const k = 1024;
                const sizes = ['Bytes', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
            }
            
            function showStatus(type, message) {
                uploadStatus.removeClass('status-success status-error').addClass('status-' + type);
                uploadStatus.html(`<i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'} me-2"></i>${message}`);
                uploadStatus.addClass('show');
                
                setTimeout(() => {
                    uploadStatus.removeClass('show');
                }, 5000);
            }
            
            // Chat Functionality
            function loadChatHistory() {
                // Always reset history on page load
                deleteCookie('chatHistory');
                const welcomeMessage = {
                    sender: 'bot',
                    content: 'Hello! Please upload a PDF document on the left, and I\'ll help you answer questions about its content.',
                    timestamp: new Date().toISOString(),
                    isError: false
                };
                chatHistory = [welcomeMessage];
                chatMessages.empty();
                renderChatHistory();
            }
            
            function renderChatHistory() {
                chatHistory.forEach(function(message) {
                    renderMessage(message.sender, message.content, message.timestamp, message.isError);
                });
                scrollToBottom();
            }
            
            function renderMessage(sender, content, timestamp, isError = false) {
                const messageTime = new Date(timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                const messageClass = sender === 'user' ? 'user-message' : 'bot-message';
                const icon = sender === 'user' ? 'fas fa-user' : 'fas fa-robot';
                const senderName = sender === 'user' ? 'You' : 'Info-Fetcher';
                
                const messageHtml = `
                    <div class="message ${messageClass}">
                        <div class="message-header">
                            <i class="${icon}"></i>
                            ${senderName}
                            <small class="opacity-75 ms-auto">${messageTime}</small>
                        </div>
                        <div class="message-content">${content}</div>
                    </div>
                `;
                
                chatMessages.append(messageHtml);
                scrollToBottom();
            }
            
            function addMessageToHistory(sender, content, isError = false) {
                const message = {
                    sender: sender,
                    content: content,
                    timestamp: new Date().toISOString(),
                    isError: isError
                };
                
                chatHistory.push(message);
                saveChatHistory();
            }
            
            function showTypingIndicator() {
                const typingHtml = `
                    <div class="message bot-message typing-indicator" id="typingIndicator">
                        <div class="message-header">
                            <i class="fas fa-robot"></i>
                            Info-Fetcher
                        </div>
                        <div class="typing-dots">
                            <div class="typing-dot"></div>
                            <div class="typing-dot"></div>
                            <div class="typing-dot"></div>
                        </div>
                        <span class="ms-2">analyzing...</span>
                    </div>
                `;
                chatMessages.append(typingHtml);
                scrollToBottom();
            }
            
            function hideTypingIndicator() {
                $('#typingIndicator').remove();
            }
            
            function sendMessage() {
                if (isProcessing || !hasUploadedFile) return;
                
                const query = userInput.val().trim();
                if (!query) {
                    showAlert('warning', 'Please enter a question first.');
                    return;
                }
                
                // Add user message
                addMessageToHistory('user', query);
                renderMessage('user', query, new Date().toISOString());
                
                // Clear input and reset height
                userInput.val('');
                setFixedTextareaHeight();
                charCount.text('0');
                
                // Show typing indicator
                showTypingIndicator();
                setFormState(false);
                
                // Send request
                $.ajax({
                    url: '/fetchreponse',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({ query: query }),
                    success: function(response) {
                        hideTypingIndicator();
                        const botResponse = response.message || 'I received your question but couldn\'t generate a proper response.';
                        
                        addMessageToHistory('bot', botResponse, false);
                        renderMessage('bot', botResponse, new Date().toISOString());
                    },
                    error: function(xhr) {
                        hideTypingIndicator();
                        let errorMessage = 'Sorry, I encountered an error while processing your request.';
                        
                        try {
                            const response = JSON.parse(xhr.responseText);
                            errorMessage = response.error || errorMessage;
                        } catch (e) {
                            // Use default error message
                        }
                        
                        addMessageToHistory('bot', errorMessage, true);
                        renderMessage('bot', errorMessage, new Date().toISOString(), true);
                    },
                    complete: function() {
                        setFormState(true);
                        userInput.focus();
                    }
                });
            }
            
            function clearChat() {
                chatHistory = [];
                deleteCookie('chatHistory');
                
                const welcomeMessage = {
                    sender: 'bot',
                    content: hasUploadedFile 
                        ? 'Chat cleared! Ask me anything about your uploaded document.' 
                        : 'Hello! Please upload a PDF document and I\'ll help you answer questions about its content.',
                    timestamp: new Date().toISOString(),
                    isError: false
                };
                chatHistory.push(welcomeMessage);
                saveChatHistory();
                
                chatMessages.empty();
                renderChatHistory();
            }
            
            function setFormState(enabled) {
                isProcessing = !enabled;
                if (hasUploadedFile) {
                    userInput.prop('disabled', !enabled);
                    sendBtn.prop('disabled', !enabled);
                }
                clearBtn.prop('disabled', !enabled);
                
                if (enabled) {
                    sendBtn.html('<i class="fas fa-paper-plane me-2"></i> Send');
                } else {
                    sendBtn.html('<i class="fas fa-spinner fa-spin me-2"></i>');
                }
            }
            
            function scrollToBottom() {
                // Using timeout to ensure DOM update is finished before scrolling
                setTimeout(() => {
                    chatMessages.scrollTop(chatMessages[0].scrollHeight);
                }, 10);
            }
            
            function showAlert(type, message) {
                // Inline feedback near the input
                inputHint.stop(true, true).text(message).show();
                if (type === 'warning' || type === 'error') {
                    userInput.addClass('invalid');
                }
                clearTimeout(window.__inputHintTimeout);
                window.__inputHintTimeout = setTimeout(() => {
                    inputHint.fadeOut(150);
                    userInput.removeClass('invalid');
                }, 2500);
            }
            
            // Helper: fix textarea height
            function setFixedTextareaHeight() {
                const el = userInput[0];
                if (!el) return;
                
                el.style.height = 'auto'; // Reset to calculate height
                el.style.height = el.scrollHeight + 'px'; // Expand to full content height
            }

            // Event Listeners
            userInput.on('input', function() {
                const count = $(this).val().length;
                charCount.text(count);
                
                setFixedTextareaHeight();

                // Clear any previous inline warnings while typing
                inputHint.hide();
                userInput.removeClass('invalid');
            });
            
            userInput.keydown(function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
            
            sendBtn.click(function() {
                sendMessage();
            });
            
            clearBtn.click(function() {
                // Disable buttons briefly to avoid double clicks
                setFormState(false);
                $.ajax({
                    url: '/clear',
                    type: 'POST',
                    success: function() {
                        // Reset client-side state to reflect cleared server
                        hasUploadedFile = false;
                        // Reset upload UI
                        fileInput.val('');
                        fileInfo.removeClass('show');
                        uploadProgress.removeClass('show');
                        progressBar.css('width', '0%');
                        showStatus('success', 'Cleared uploaded document and chat.');
                        // Disable chat input and reset fields
                        userInput.val('').prop('disabled', true)
                                 .attr('placeholder', 'Upload a PDF to start chatting...');
                        setFixedTextareaHeight();
                        sendBtn.prop('disabled', true);
                        charCount.text('0');
                        // Reset chat messages/history
                        clearChat();
                    },
                    error: function(xhr) {
                        let msg = 'Failed to clear server state';
                        try {
                            const resp = JSON.parse(xhr.responseText);
                            msg = resp.error || msg;
                        } catch (e) {}
                        showStatus('error', msg);
                    },
                    complete: function() {
                        // Re-enable buttons (send remains disabled by hasUploadedFile=false)
                        setFormState(true);
                    }
                });
            });
            
            // Initialize: fully clear server state and history on page load
            $.post('/clear').always(function() {
                loadChatHistory();
                setFixedTextareaHeight();
            });

            // Adjust textarea height if layout metrics change
            $(window).on('resize', setFixedTextareaHeight);
        });
    </script>
</body>
</html>
