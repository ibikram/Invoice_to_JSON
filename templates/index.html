<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Invoice Processor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <style>
        :root {
            --bg: #ffffff;
            --card-bg: #ffffff;
            --text: #212529;
            --muted: #6c757d;
            --border: #dee2e6;
            --primary: #0d6efd;
            --accent: #7952b3;
        }
        .theme-dark {
            --bg: #0f1115;
            --card-bg: #141820;
            --text: #e6e6e6;
            --muted: #a0a4ad;
            --border: #2a2f3a;
            --primary: #4da3ff;
            --accent: #9b7bff;
        }
        body {
            background: var(--bg);
            color: var(--text);
        }
        .navbar-custom {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
        }
        .file-item {
            margin-bottom: 5px;
            padding: 8px;
            border-radius: 4px;
            background-color: var(--card-bg);
            border: 1px dashed var(--border);
        }
        .processing-spinner {
            width: 1.5rem;
            height: 1.5rem;
        }
        .result-card {
            margin-top: 20px;
            border: 1px solid var(--border);
            border-left: 4px solid var(--primary);
            background: var(--card-bg);
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .file-drop-area {
            border: 2px dashed #ccc;
            border-radius: 8px;
            padding: 25px;
            text-align: center;
            background-color: var(--card-bg);
            transition: all 0.3s;
        }
        .file-drop-area.highlight {
            border-color: #0d6efd;
            background-color: rgba(13,110,253,0.05);
        }
        #uploadProgress {
            display: none;
        }
        .success-icon {
            color: #198754;
        }
        .error-icon {
            color: #dc3545;
        }
        .toolbar .btn, .toolbar .form-select {
            transition: transform 0.1s ease;
        }
        .toolbar .btn:active { transform: scale(0.98); }
        .legend-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; }
        .legend .low { background: red; }
        .legend .med { background: orange; }
        .legend .ok { background: #198754; }
        .card-header { position: sticky; top: 0; z-index: 1; }
        .collapse-toggle { cursor: pointer; }
    </style>
</head>
<body>
    <!-- Top Navbar -->
    <nav class="navbar navbar-custom fixed-top">
        <div class="container-fluid px-3">
            <span class="navbar-brand mb-0 h5 d-flex align-items-center gap-2">
                <i class="bi bi-receipt"></i> Invoice Processor
            </span>
            <div class="d-flex align-items-center gap-2">
                <button id="toggleTheme" class="btn btn-sm btn-outline-secondary">
                    <i class="bi bi-moon-stars me-1"></i><span class="theme-label">Dark</span>
                </button>
            </div>
        </div>
    </nav>
    <div class="container" style="margin-top: 80px;">
        <div class="row">
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h2 class="card-title text-center mb-4">PDF Invoice Processor</h2>
                        
                        <!-- File Upload Section -->
                        <div class="file-drop-area mb-3" id="dropArea">
                            <div>
                                <i class="bi bi-cloud-arrow-up fs-1"></i>
                                <p>Drag & drop PDF files here or click to browse</p>
                                <input type="file" id="fileInput" multiple accept=".pdf" class="d-none">
                                <button class="btn btn-primary" id="browseButton">Browse Files</button>
                            </div>
                        </div>
                        
                        <!-- Selected Files List -->
                        <div id="fileList" class="mb-3"></div>
                        
                        <!-- Upload Button -->
                        <div class="d-grid gap-2">
                            <button class="btn btn-success" id="uploadButton" disabled>
                                Upload Files
                            </button>
                        </div>
                        
                        <!-- Progress Bar -->
                        <div class="mt-3" id="uploadProgress">
                            <div class="progress">
                                <div class="progress-bar progress-bar-striped progress-bar-animated" 
                                     role="progressbar" style="width: 100%"></div>
                            </div>
                            <p class="text-center mt-2" id="statusMessage">Processing...</p>
                        </div>
                        
                        <!-- Job ID Display -->
                        <div class="alert alert-info mt-3" id="jobIdContainer" style="display: none">
                            <strong>Job ID:</strong> <span id="jobId"></span>
                            <button class="btn btn-sm btn-outline-primary float-end" id="copyJobId">Copy</button>
                        </div>
                        
                        <!-- Results Section -->
                        <div id="resultsContainer" class="mt-4" style="display: none">
                            <div class="d-flex align-items-center justify-content-between border-bottom pb-2 toolbar">
                                <div class="d-flex align-items-center gap-2">
                                    <h4 class="m-0">Results</h4>
                                    <div class="legend ms-3 small text-muted">
                                        <span class="legend-dot low"></span><span class="me-3">conf < 0.9</span>
                                        <span class="legend-dot med"></span><span class="me-3">0.9 ≤ conf < 0.97</span>
                                        <span class="legend-dot ok"></span><span>conf ≥ 0.97</span>
                                    </div>
                                </div>
                                <div class="d-flex align-items-center gap-2">
                                    <div class="d-flex align-items-center gap-2 me-2">
                                        <label for="viewMode" class="form-label m-0 me-1">View</label>
                                        <select id="viewMode" class="form-select form-select-sm" style="width: auto;">
                                            <option value="values" selected>Values only</option>
                                            <option value="values_conf">Values + confidence</option>
                                        </select>
                                    </div>
                                    <button id="expandAll" class="btn btn-sm btn-outline-secondary" title="Expand all"><i class="bi bi-arrows-expand"></i></button>
                                    <button id="collapseAll" class="btn btn-sm btn-outline-secondary" title="Collapse all"><i class="bi bi-arrows-collapse"></i></button>
                                    <button id="copyAll" class="btn btn-sm btn-outline-secondary" title="Copy all JSON"><i class="bi bi-clipboard"></i></button>
                                    <button id="downloadAll" class="btn btn-sm btn-primary" title="Download all JSON"><i class="bi bi-download me-1"></i>Download</button>
                                </div>
                            </div>
                            <div id="resultsContent"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    

    <script>
        $(document).ready(function() {
            // Variables
            let selectedFiles = [];
            let currentJobId = null;
            let pollingInterval = false;
            let showConfidence = false; // controls value-only vs value+confidence view
            let lastResults = null;     // cache last results to re-render on toggle
            window.LOCAL_FILE_URLS = {}; // filename -> object URL for locally selected files
            
            // Theme init
            function applyTheme(mode) {
                if (mode === 'dark') {
                    $('body').addClass('theme-dark');
                    $('.theme-label').text('Light');
                    $('#toggleTheme i').removeClass('bi-moon-stars').addClass('bi-sun');
                } else {
                    $('body').removeClass('theme-dark');
                    $('.theme-label').text('Dark');
                    $('#toggleTheme i').removeClass('bi-sun').addClass('bi-moon-stars');
                }
            }
            let savedTheme = localStorage.getItem('theme') || 'light';
            applyTheme(savedTheme);
            $('#toggleTheme').on('click', function() {
                savedTheme = (savedTheme === 'light') ? 'dark' : 'light';
                localStorage.setItem('theme', savedTheme);
                applyTheme(savedTheme);
            });
            
            // Connect file input to browse button
            $("#browseButton").click(function() {
                $("#fileInput").click();
            });
            
            // Handle file selection
            $("#fileInput").change(function(e) {
                handleFiles(e.target.files);
            });
            
            // Drag and drop functionality
            const dropArea = document.getElementById('dropArea');
            
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                dropArea.addEventListener(eventName, preventDefaults, false);
            });
            
            function preventDefaults(e) {
                e.preventDefault();
                e.stopPropagation();
            }
            
            ['dragenter', 'dragover'].forEach(eventName => {
                dropArea.addEventListener(eventName, highlight, false);
            });
            
            ['dragleave', 'drop'].forEach(eventName => {
                dropArea.addEventListener(eventName, unhighlight, false);
            });
            
            function highlight() {
                dropArea.classList.add('highlight');
            }
            
            function unhighlight() {
                dropArea.classList.remove('highlight');
            }
            
            dropArea.addEventListener('drop', function(e) {
                const dt = e.dataTransfer;
                const files = dt.files;
                handleFiles(files);
            }, false);
            
            // Process selected files
            function handleFiles(files) {
                const pdfFiles = Array.from(files).filter(file => file.type === 'application/pdf');
                
                if (pdfFiles.length === 0) {
                    alert("Please select PDF files only.");
                    return;
                }
                
                // Revoke any previous object URLs
                try {
                    Object.values(window.LOCAL_FILE_URLS || {}).forEach(url => URL.revokeObjectURL(url));
                } catch (e) {}
                window.LOCAL_FILE_URLS = {};

                // Create object URLs for local preview/open
                pdfFiles.forEach(f => {
                    try { window.LOCAL_FILE_URLS[f.name] = URL.createObjectURL(f); } catch (e) {}
                });

                selectedFiles = pdfFiles;
                updateFileList();
                $("#uploadButton").prop("disabled", selectedFiles.length === 0);
            }
            // Revoke object URLs on unload
            window.addEventListener('beforeunload', () => {
                try {
                    Object.values(window.LOCAL_FILE_URLS || {}).forEach(url => URL.revokeObjectURL(url));
                } catch (e) {}
            });
            
            // Update file list display
            function updateFileList() {
                const fileList = $("#fileList");
                fileList.empty();
                
                if (selectedFiles.length === 0) {
                    fileList.html("<p class='text-muted'>No files selected</p>");
                    return;
                }
                
                selectedFiles.forEach((file, index) => {
                    const fileSize = formatFileSize(file.size);
                    const fileItem = $(`
                        <div class="file-item d-flex justify-content-between align-items-center">
                            <div>
                                <strong>${file.name}</strong> (${fileSize})
                            </div>
                            <button class="btn btn-sm btn-outline-danger remove-file" data-index="${index}">
                                &times;
                            </button>
                        </div>
                    `);
                    fileList.append(fileItem);
                });
                
                // Add event listeners for remove buttons
                $(".remove-file").click(function() {
                    const index = $(this).data("index");
                    selectedFiles.splice(index, 1);
                    updateFileList();
                    $("#uploadButton").prop("disabled", selectedFiles.length === 0);
                });
            }
            
            // Format file size
            function formatFileSize(bytes) {
                if (bytes < 1024) return bytes + " bytes";
                else if (bytes < 1048576) return (bytes / 1024).toFixed(1) + " KB";
                else return (bytes / 1048576).toFixed(1) + " MB";
            }
            
            // Handle file upload
            $("#uploadButton").click(function() {
                if (selectedFiles.length === 0) return;
                
                // Create form data
                const formData = new FormData();
                selectedFiles.forEach(file => {
                    formData.append("files", file);
                });
                
                // Show progress
                $("#uploadProgress").show();
                $("#statusMessage").text("Uploading files...");
                $("#uploadButton").prop("disabled", true);
                
                // Make AJAX request
                $.ajax({
                    url: "/upload",
                    type: "POST",
                    data: formData,
                    processData: false,
                    contentType: false,
                    success: function(response) {
                        // Show job ID
                        // debugger
                        if (!response.success){
                            alert(response.msg)
                            resultsContainer.show();
                            $("#uploadButton").prop("disabled", false);
                            return

                        }
                        $("#jobId").text(response['job_id'] || response['payload'] || '');
                        $("#jobIdContainer").show();
                        
                        // Show upload results
                        $("#statusMessage").text("Files uploaded successfully. Processing...");
                        console.log('startPolling')
                        // Start polling for results
                        startPolling(response['payload']);
                    },
                    error: function(xhr, status, error) {
                        $("#statusMessage").text("Error: " + (xhr.responseJSON?.error || error));
                        $("#uploadProgress .progress-bar").addClass("bg-danger");
                    }
                });
            });
            
            // Copy job ID to clipboard
            $("#copyJobId").click(function() {
                const jobId = $("#jobId").text();
                navigator.clipboard.writeText(jobId).then(function() {
                    const originalText = $("#copyJobId").text();
                    $("#copyJobId").text("Copied!");
                    setTimeout(function() {
                        $("#copyJobId").text(originalText);
                    }, 2000);
                });
            });

            // Poll for results
             
            function startPolling(payload) {
                if (pollingInterval) clearInterval(pollingInterval);
                checkResults(payload);
                pollingInterval = setInterval(function() {
                    checkResults(payload);
                }, 3000); // Poll every 3 seconds
            }
            
            // Check for results
            function checkResults(payload) {
                // Create form data
                const formData = new FormData();
                formData.append("payload", payload);
                
                // Make AJAX request
                $.ajax({
                    url: "/result",
                    type: "POST",
                    data: formData,
                    processData: false,
                    contentType: false,
                    success: function(response) {
                        if (response.statusCode != 200) {
                            // Still processing, continue polling
                            $("#statusMessage").text(response.message);

                            return false;
                        }
                        console.log("Ajax response...")
                        console.log(response)
                        // Results are ready
                        clearInterval(pollingInterval);
                        $("#statusMessage").text("Processing complete!");
                        $("#uploadProgress .progress-bar").removeClass("progress-bar-animated").addClass("bg-success");
                        
                        // Display results
                        console.log("Response:", response);
                        lastResults = response;
                        displayResultsForm(response);
                        return true
                    },
                    error: function(xhr, status, error) {
                        $("#statusMessage").text("Error retrieving results: " + (xhr.responseJSON?.error || error));
                        $("#uploadProgress .progress-bar").addClass("bg-danger");
                        clearInterval(pollingInterval);
                    }
                });
            }
            
            // Display results
            function displayResults(results) {
                const resultsContainer = $("#resultsContainer");
                const resultsContent = $("#resultsContent");
                resultsContent.empty();

                if (!results || !results.data || results.data.length === 0) {
                    resultsContent.html("<p class='text-muted'>No results available</p>");
                    resultsContainer.show();
                    return;
                }

                const confidenceThreshold = 0.97; // Threshold for yellow color
                const errorThreshold = 0.9; // Threshold for red color

                // Recursive JSON → HTML converter
                function jsonToHtml(obj, indent = 0) {
                    const pad = " ".repeat(indent * 4); // spaces for indentation
                    let html = "";

                    if (Array.isArray(obj)) {
                        html += "[\n";
                        obj.forEach((item, idx) => {
                            html += pad + "    " + jsonToHtml(item, indent + 1) + (idx < obj.length - 1 ? "," : "") + "\n";
                        });
                        html += pad + "]";
                    } 
                    else if (typeof obj === 'object' && obj !== null) {
                        html += "{\n";
                        const keys = Object.keys(obj);
                        keys.forEach((key, idx) => {
                            let displayKey = key;
                            const value = obj[key];

                            // Check confidence value
                            if (value && value.value && Array.isArray(value.value)) {
                                let conf = parseFloat(value.value[1]);
                                if (!isNaN(conf) && conf < confidenceThreshold && conf > errorThreshold) {
                                    displayKey = `<span style="color:orange">${key}</span>`;
                                }
                                else if (!isNaN(conf) && conf < errorThreshold && conf > 0) {
                                    displayKey = `<span style="color:red">${key}</span>`;
                                }
                            }

                            html += pad + "    \"" + displayKey + "\": " + jsonToHtml(value, indent + 1);
                            if (idx < keys.length - 1) html += ",";
                            html += "\n";
                        });
                        html += pad + "}";
                    } 
                    else {
                        html += JSON.stringify(obj);
                    }
                    return html;
                }

                results.data.forEach(item => {
                    if (!item.json_response) return;

                    try {
                        const parsed = typeof item.json_response === 'string'
                            ? JSON.parse(item.json_response)
                            : item.json_response;

                        const prettyHtml = jsonToHtml(parsed);

                        const resultCard = $(`
                            <div class="card result-card mb-3">
                                <div class="card-header bg-light">
                                    <strong>File:</strong> ${item.filename || 'Unknown file'}
                                </div>
                                <div class="card-body">
                                    <div class="result-json" style="white-space: pre; font-family: monospace;">${prettyHtml}</div>
                                </div>
                            </div>
                        `);

                        resultsContent.append(resultCard);
                    } catch (error) {
                        console.error("Error parsing JSON response:", error);
                        resultsContent.append(`
                            <div class="alert alert-warning">
                                Error parsing results for ${item.filename || 'Unknown file'}
                            </div>
                        `);
                    }
                });

                resultsContainer.show();
                $("#uploadButton").prop("disabled", false);
            }

            // View mode toggle
            $(document).on('change', '#viewMode', function() {
                const mode = $(this).val();
                showConfidence = (mode === 'values_conf');
                if (lastResults) {
                    displayResultsForm(lastResults);
                }
            });

            // Expand/Collapse All
            $(document).on('click', '#expandAll', function() {
                $('.result-card .card-body').removeClass('d-none');
                $('.result-card .toggle-card i').removeClass('bi-chevron-down').addClass('bi-chevron-up');
            });
            $(document).on('click', '#collapseAll', function() {
                $('.result-card .card-body').addClass('d-none');
                $('.result-card .toggle-card i').removeClass('bi-chevron-up').addClass('bi-chevron-down');
            });

            // Copy/Download All
            function collectAllEdited() {
                const all = {};
                $('#resultsContent .result-card').each(function() {
                    const card = $(this);
                    const fname = card.data('filename') || 'result';
                    const edited = collectEditedJson(card.find('.card-body'));
                    all[fname] = edited;
                });
                return all;
            }
            $(document).on('click', '#copyAll', function() {
                const all = collectAllEdited();
                const text = JSON.stringify(all, null, 2);
                navigator.clipboard.writeText(text).then(() => {
                    const btn = $(this);
                    const original = btn.html();
                    btn.html('<i class="bi bi-clipboard-check"></i>');
                    setTimeout(() => btn.html(original), 1200);
                });
            });
            $(document).on('click', '#downloadAll', function() {
                const all = collectAllEdited();
                const blob = new Blob([JSON.stringify(all, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'results.json';
                document.body.appendChild(a);
                a.click();
                a.remove();
                URL.revokeObjectURL(url);
            });

            // New: Display results as editable input fields with copy/download
            function displayResultsForm(results) {
                const resultsContainer = $("#resultsContainer");
                const resultsContent = $("#resultsContent");
                resultsContent.empty();

                if (!results || !results.data || results.data.length === 0) {
                    resultsContent.html("<p class='text-muted'>No results available</p>");
                    resultsContainer.show();
                    return;
                }

                function escapeHtml(str) {
                    return String(str)
                        .replace(/&/g, '&amp;')
                        .replace(/</g, '&lt;')
                        .replace(/>/g, '&gt;')
                        .replace(/\"/g, '&quot;')
                        .replace(/'/g, '&#039;');
                }

                function parseConfidence(confRaw) {
                    if (confRaw === undefined || confRaw === null) return null;
                    if (typeof confRaw === 'number') return confRaw === 0 ? null : confRaw;
                    const s = String(confRaw).trim().toUpperCase();
                    if (!s || s === 'NA' || s === 'N/A' || s === 'NONE' || s === '-') return null;
                    const n = parseFloat(s);
                    if (!isNaN(n)) {
                        if (n === 0) return null; // ignore 0
                        return n;
                    }
                    return null;
                }

                function colorForConfidence(confNum) {
                    if (confNum === null) return '';
                    if (confNum < 0.9) return 'red';
                    if (confNum < 0.97) return 'orange';
                    return '';
                }

                function getFileUrl(item) {
                    if (!item) return null;
                    const direct = item.file_url || item.url || item.pdf_url || item.view_url || item.signed_url;
                    if (direct) return direct;
                    if (window.LOCAL_FILE_URLS && item.filename && window.LOCAL_FILE_URLS[item.filename]) {
                        return window.LOCAL_FILE_URLS[item.filename];
                    }
                    if (window.FILE_BASE_URL && item.filename) {
                        const base = String(window.FILE_BASE_URL).replace(/\/$/, '');
                        return base + '/' + encodeURIComponent(item.filename);
                    }
                    return null;
                }

                function jsonToForm(obj, path = '') {
                    const container = $('<div class="ms-2"></div>');
                    if (Array.isArray(obj)) {
                        obj.forEach((item, idx) => {
                            const itemPath = path + '[' + idx + ']';
                            const group = $(`
                                <div class="mb-2 p-2 border rounded">
                                    <div class="text-muted small mb-1">[${idx}]</div>
                                </div>
                            `);
                            group.append(jsonToForm(item, itemPath));
                            container.append(group);
                        });
                        return container;
                    }
                    if (obj && typeof obj === 'object') {
                        Object.keys(obj).forEach((key) => {
                            const value = obj[key];
                            const fieldPath = path ? path + '.' + key : key;
                            const row = $('<div class="mb-2"></div>');

                            // Special handling: objects in the form { value: [val, conf] } or { value: val }
                            const isValueWrapper = value && typeof value === 'object' && !Array.isArray(value) && Object.keys(value).length === 1 && Object.prototype.hasOwnProperty.call(value, 'value');
                            if (isValueWrapper) {
                                const inner = value.value;
                                let valPart = inner;
                                let confPart = undefined;
                                if (Array.isArray(inner)) {
                                    valPart = inner[0];
                                    confPart = inner.length > 1 ? inner[1] : undefined;
                                }
                                const confNum = parseConfidence(confPart);
                                const color = colorForConfidence(confNum);
                                const type = (typeof valPart === 'number') ? 'number' : (typeof valPart === 'boolean' ? 'checkbox' : 'text');
                                const inputWrapper = $('<div class="input-group"></div>');
                                const label = $(`<span class="input-group-text" style="min-width: 180px">${escapeHtml(key)}</span>`);
                                if (color) label.css('color', color);
                                let input;
                                if (type === 'checkbox') {
                                    input = $('<input class="form-check-input ms-2" type="checkbox">');
                                    if (valPart) input.prop('checked', true);
                                } else {
                                    input = $(`<input class="form-control" type="${type}">`);
                                    input.val(valPart === null ? '' : valPart);
                                }
                                input.attr('data-path', fieldPath);
                                input.attr('data-type', (valPart === null) ? 'null' : typeof valPart);
                                if (confPart !== undefined) input.attr('data-conf', confPart);
                                inputWrapper.append(label).append(input);
                                if (showConfidence && confNum !== null) {
                                    inputWrapper.append(`<span class="input-group-text bg-light">conf: ${escapeHtml(confPart)}</span>`);
                                }
                                row.append(inputWrapper);
                                container.append(row);
                                return; // continue next key
                            }

                            // Recurse for other objects/arrays
                            if (value && typeof value === 'object' && !Array.isArray(value)) {
                                row.append(`<label class="form-label fw-semibold">${escapeHtml(key)}</label>`);
                                row.append(jsonToForm(value, fieldPath));
                            } else if (Array.isArray(value)) {
                                row.append(`<label class="form-label fw-semibold">${escapeHtml(key)}</label>`);
                                row.append(jsonToForm(value, fieldPath));
                            } else {
                                const type = (typeof value === 'number') ? 'number' : (typeof value === 'boolean' ? 'checkbox' : 'text');
                                const inputWrapper = $('<div class="input-group"></div>');
                                const label = $(`<span class="input-group-text" style="min-width: 180px">${escapeHtml(key)}</span>`);
                                let input;
                                if (type === 'checkbox') {
                                    input = $('<input class="form-check-input ms-2" type="checkbox">');
                                    if (value) input.prop('checked', true);
                                } else {
                                    input = $(`<input class="form-control" type="${type}">`);
                                    input.val(value === null ? '' : value);
                                }
                                input.attr('data-path', fieldPath);
                                input.attr('data-type', (value === null) ? 'null' : typeof value);
                                inputWrapper.append(label).append(input);
                                row.append(inputWrapper);
                            }
                            container.append(row);
                        });
                        return container;
                    }

                    // Primitive
                    const input = $('<input class="form-control mb-2" type="text">');
                    input.val(obj === null ? '' : obj);
                    input.attr('data-path', path);
                    input.attr('data-type', (obj === null) ? 'null' : typeof obj);
                    container.append(input);
                    return container;
                }

                function setByPath(root, path, value) {
                    const tokens = [];
                    const re = /([^.\[\]]+)|(\[(\d+)\])/g;
                    let m;
                    while ((m = re.exec(path)) !== null) {
                        if (m[1]) tokens.push(m[1]);
                        if (m[3]) tokens.push(Number(m[3]));
                    }
                    let cur = root;
                    for (let i = 0; i < tokens.length; i++) {
                        const t = tokens[i];
                        const next = tokens[i + 1];
                        const isLast = i === tokens.length - 1;
                        if (isLast) {
                            cur[t] = value;
                        } else {
                            if (typeof next === 'number') {
                                if (!Array.isArray(cur[t])) cur[t] = [];
                            } else {
                                if (typeof cur[t] !== 'object' || cur[t] === null || Array.isArray(cur[t])) cur[t] = {};
                            }
                            cur = cur[t];
                        }
                    }
                }

                function collectEditedJson(cardBody) {
                    let root = {};
                    cardBody.find('[data-path]').each(function() {
                        const el = $(this);
                        const path = el.data('path');
                        const type = el.data('type');
                        const conf = el.data('conf');
                        let val;
                        if (type === 'boolean') {
                            val = el.is(':checked');
                        } else if (type === 'number') {
                            const n = parseFloat(el.val());
                            val = isNaN(n) ? null : n;
                        } else if (type === 'null') {
                            val = (el.val() === '') ? null : el.val();
                        } else {
                            val = el.val();
                        }
                        // If confidence is associated, keep it in an array [value, conf], else just the value
                        if (conf !== undefined) {
                            setByPath(root, path, [val, String(conf)]);
                        } else {
                            setByPath(root, path, val);
                        }
                    });
                    return root;
                }

                results.data.forEach(item => {
                    if (!item.json_response) return;
                    try {
                        const parsed = typeof item.json_response === 'string'
                            ? JSON.parse(item.json_response)
                            : item.json_response;

                        const formEl = jsonToForm(parsed);
                        const fileUrl = getFileUrl(item);
                        const fileNameSafe = escapeHtml(item.filename || 'Unknown file');
                        const fileLabelHtml = fileUrl
                            ? `<a href="${fileUrl}" target="_blank" rel="noopener noreferrer">${fileNameSafe}</a>`
                            : fileNameSafe;
                        const resultCard = $(`
                            <div class="card result-card mb-3">
                                <div class="card-header bg-light d-flex justify-content-between align-items-center">
                                    <div class="d-flex align-items-center gap-2">
                                        <button class="btn btn-sm btn-outline-secondary toggle-card" title="Collapse/expand"><i class="bi bi-chevron-up"></i></button>
                                        <div><strong>File:</strong> ${fileLabelHtml}</div>
                                    </div>
                                    <div class="btn-group">
                                        <button class="btn btn-sm btn-outline-secondary copy-json">Copy JSON</button>
                                        <button class="btn btn-sm btn-outline-primary download-json">Download JSON</button>
                                    </div>
                                </div>
                                <div class="card-body"></div>
                            </div>
                        `);

                        const cardBody = resultCard.find('.card-body');
                        cardBody.append(formEl);
                        resultCard.attr('data-filename', item.filename || 'result');

                        // Per-card collapse
                        resultCard.find('.toggle-card').on('click', function() {
                            cardBody.toggleClass('d-none');
                            const icon = $(this).find('i');
                            icon.toggleClass('bi-chevron-up bi-chevron-down');
                        });

                        resultCard.find('.copy-json').on('click', function() {
                            const edited = collectEditedJson(cardBody);
                            const text = JSON.stringify(edited, null, 2);
                            navigator.clipboard.writeText(text).then(() => {
                                const btn = $(this);
                                const original = btn.text();
                                btn.text('Copied!');
                                setTimeout(() => btn.text(original), 1500);
                            });
                        });
                        resultCard.find('.download-json').on('click', function() {
                            const edited = collectEditedJson(cardBody);
                            const blob = new Blob([JSON.stringify(edited, null, 2)], { type: 'application/json' });
                            const url = URL.createObjectURL(blob);
                            const a = document.createElement('a');
                            a.href = url;
                            a.download = (item.filename ? item.filename.replace(/\.[^.]+$/, '') : 'result') + '.json';
                            document.body.appendChild(a);
                            a.click();
                            a.remove();
                            URL.revokeObjectURL(url);
                        });

                        resultsContent.append(resultCard);
                    } catch (error) {
                        console.error("Error parsing JSON response:", error);
                        resultsContent.append(`
                            <div class="alert alert-warning">
                                Error parsing results for ${item.filename || 'Unknown file'}
                            </div>
                        `);
                    }
                });

                resultsContainer.show();
                $("#uploadButton").prop("disabled", false);
            }

            // Initialize the page
            updateFileList();
        });
    </script>
</body>
</html>
