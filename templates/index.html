<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Invoice Extractor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    
    <style>
        :root {
            /* "Aurora" Dark Palette */
            --bg-deep: #0f172a;       /* Deep Slate */
            --bg-glass: rgba(30, 41, 59, 0.7); 
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #ec4899 100%); /* Indigo to Pink */
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-glass: 1px solid rgba(255, 255, 255, 0.1);
            --radius-xl: 24px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            padding-top: 90px;
            overflow-x: hidden;
        }

        /* Ambient Background Glow */
        body::before, body::after {
            content: '';
            position: fixed;
            width: 50vw;
            height: 50vw;
            z-index: -1;
            filter: blur(80px);
            opacity: 0.4;
            animation: float 10s infinite ease-in-out;
        }
        body::before {
            top: -10%; left: -10%;
            background: radial-gradient(circle, #6366f1 0%, transparent 70%);
        }
        body::after {
            bottom: -10%; right: -10%;
            background: radial-gradient(circle, #ec4899 0%, transparent 70%);
            animation-delay: -5s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(20px, 40px); }
        }

        /* Glass Navbar */
        .navbar-custom {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: var(--border-glass);
            height: 70px;
        }
        .navbar-brand { font-weight: 700; color: white !important; display: flex; align-items: center; gap: 10px; }
        .brand-icon { background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .nav-link { color: var(--text-muted) !important; transition: 0.3s; padding: 8px 16px; border-radius: 20px; }
        .nav-link:hover { color: white !important; background: rgba(255,255,255,0.05); }

        /* --- RESPONSIVE WRAPPER --- */
        .main-wrapper {
            width: 90%;
            max-width: 1600px;
            margin: 0 auto;
        }

        /* Main Glass Card */
        .glass-card {
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            border: var(--border-glass);
            border-radius: var(--radius-xl);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            padding: 3vw;
            position: relative;
            overflow: hidden;
        }
        .glass-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
        }

        .gradient-text {
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        /* Drop Zone */
        .drop-zone {
            background: rgba(0, 0, 0, 0.2);
            border: 2px dashed rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 3rem 1rem;
            text-align: center;
            transition: 0.3s;
            cursor: pointer;
        }
        .drop-zone:hover, .drop-zone.highlight {
            border-color: #6366f1;
            background: rgba(99, 102, 241, 0.05);
            transform: translateY(-2px);
        }
        .drop-icon { font-size: 3rem; color: #64748b; margin-bottom: 1rem; transition: 0.3s; }
        .drop-zone:hover .drop-icon { color: #818cf8; transform: scale(1.1); }

        /* Buttons */
        .btn-glow {
            background: var(--accent-gradient);
            color: white; border: none; padding: 12px 30px; border-radius: 12px;
            font-weight: 600; box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4); transition: 0.3s;
        }
        .btn-glow:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(236, 72, 153, 0.5); color: white; }
        .btn-glow:disabled { opacity: 0.6; filter: grayscale(1); }
        
        .btn-glass {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-main); border-radius: 8px; transition: 0.2s;
        }
        .btn-glass:hover { background: rgba(255,255,255,0.1); color: white; border-color: rgba(255,255,255,0.3); }

        /* File List */
        .file-item {
            background: rgba(255,255,255,0.03); border-radius: 10px; padding: 10px 15px;
            border: 1px solid rgba(255,255,255,0.05); margin-bottom: 8px;
            display: flex; justify-content: space-between; align-items: center;
        }

        /* Results */
        .result-card {
            background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px; margin-bottom: 20px; overflow: hidden;
        }
        .result-header {
            background: rgba(0,0,0,0.2); padding: 15px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex; justify-content: space-between; align-items: center;
        }

        /* Inputs */
        .form-control-dark {
            background-color: #0f172a; border: 1px solid #334155; color: #f1f5f9;
            border-radius: 8px; padding: 8px 12px; font-size: 0.95rem;
        }
        .form-control-dark:focus {
            background-color: #0f172a; border-color: #818cf8; color: white;
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2); outline: none;
        }
        .input-group-text-dark {
            background-color: rgba(255,255,255,0.03); border: 1px solid #334155;
            color: #94a3b8; min-width: 140px; border-right: none;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }

        .logo { height: 45px; filter: brightness(0) invert(1); opacity: 0.8; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }

        /* Progress Bar Customization */
        .progress-custom {
            height: 12px; /* Slightly taller */
            background: rgba(255,255,255,0.1);
            border-radius: 6px;
            overflow: hidden;
        }
        .progress-bar-custom {
            background: var(--accent-gradient);
            transition: width 0.6s ease;
        }

        /* --- Custom Beautiful Toggle --- */
        .custom-toggle-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            user-select: none;
        }
        .custom-toggle-input { display: none; }
        .custom-toggle-track {
            width: 46px;
            height: 24px;
            background: rgba(15, 23, 42, 0.8); /* Dark Slate */
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            position: relative;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
        }
        .custom-toggle-knob {
            width: 18px;
            height: 18px;
            background: #94a3b8;
            border-radius: 50%;
            position: absolute;
            top: 2px;
            left: 3px;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        .custom-toggle-input:checked + .custom-toggle-track {
            background: var(--accent-gradient);
            border-color: rgba(255,255,255,0.1);
        }
        .custom-toggle-input:checked + .custom-toggle-track .custom-toggle-knob {
            transform: translateX(22px);
            background: white;
            box-shadow: 0 0 10px rgba(255,255,255,0.8);
        }
        .toggle-label-text {
            font-size: 0.85rem;
            color: var(--text-muted);
            transition: 0.3s;
            font-weight: 500;
        }
        .custom-toggle-input:checked ~ .toggle-label-text {
            color: white;
            text-shadow: 0 0 15px rgba(99, 102, 241, 0.6);
        }

        /* --- FIXED: Visibility Control for Scores --- */
        /* By default, hide confidence scores */
        .conf-score { display: none; }
        /* When container has .show-scores class, display them */
        .show-scores .conf-score { display: block; animation: fadeIn 0.3s ease; }

    </style>
</head>
<body>

    <nav class="navbar navbar-custom fixed-top">
        <div class="container-fluid px-lg-5">
            <div class="d-flex align-items-center gap-4">
                <a class="navbar-brand" href="#">
                    <i class="bi bi-cpu-fill brand-icon"></i> Invoice Parser
                </a>
                <div class="d-none d-md-flex gap-1">
                    <a class="nav-link" href="/threeway">PO-Invoice Verification</a>
                    <a class="nav-link" href="/converse">Converse</a>
                </div>
            </div>
            <a href="https://adamastechconsulting.com/about-us/" target="_blank">
                <img class="logo" src="https://adamastech.in/wp-content/themes/atc-child/assets/images/atc-foot-logo.png" alt="ATC Logo">
            </a>
        </div>
    </nav>

    <div class="main-wrapper">
        <div class="row justify-content-center">
            <div class="col-12">
                
                <div class="glass-card mb-5 animate-fade-in">
                    <div class="text-center mb-5">
                        <h1 class="display-5 fw-bold mb-2"><span class="gradient-text">PDF Invoice Intelligence</span></h1>
                        <p class="text-white fs-5">Extract structured data from documents instantly.</p>
                    </div>

                    <div class="drop-zone mb-4" id="dropArea">
                        <i class="bi bi-cloud-arrow-up-fill drop-icon"></i>
                        <h5 class="fw-bold text-light">Drop Files Here</h5>
                        <p class="text-white small mb-3">Drag & drop PDF files here or click to browse</p>
                        <input type="file" id="fileInput" multiple accept=".pdf" class="d-none">
                        <button class="btn btn-glass px-4 rounded-pill" id="browseButton">
                            <i class="bi bi-search me-2"></i>Browse Files
                        </button>
                    </div>

                    <div id="fileList" class="mb-4"></div>

                    <div class="d-grid gap-2 mb-3">
                        <button class="btn btn-glow py-3 fs-5" id="uploadButton" disabled>
                            Process
                        </button>
                    </div>

                    <div id="uploadProgress" style="display: none;" class="mt-4">
                        <div class="d-flex justify-content-between mb-2 small">
                            <span class="text-info fw-bold" id="statusTitle">Processing...</span>
                            <span class="text-white" id="statusPercent">0%</span>
                        </div>
                        
                        <div class="progress progress-custom">
                            <div id="mainProgressBar" class="progress-bar progress-bar-custom" style="width: 0%;"></div>
                        </div>
                        
                        <p id="statusMessage" class="text-center text-white small mt-2 opacity-75"></p>
                    </div>

                    <div id="jobIdContainer" style="display: none" class="mt-4 p-3 rounded bg-dark border border-secondary">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <span class="text-white small text-uppercase fw-bold me-2">Job ID</span>
                                <span id="jobId" class="font-monospace text-info"></span>
                            </div>
                            <button class="btn btn-sm btn-outline-light rounded-circle" id="copyJobId"><i class="bi bi-copy"></i></button>
                        </div>
                    </div>
                </div>

                <div id="resultsContainer" style="display: none">
                    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 px-2">
                        <h3 class="fw-bold m-0 text-white"><i class="bi bi-grid-1x2-fill me-2 text-info"></i>Results</h3>
                        <div class="d-flex gap-2 mt-2 mt-md-0 align-items-center">
                            
                            <label class="custom-toggle-wrapper border-end border-secondary pe-3 me-2">
                                <input type="checkbox" id="toggleConfidence" class="custom-toggle-input">
                                <div class="custom-toggle-track">
                                    <div class="custom-toggle-knob"></div>
                                </div>
                                <span class="toggle-label-text">Show Scores</span>
                            </label>

                            <button id="expandAll" class="btn btn-sm btn-glass" title="Expand"><i class="bi bi-arrows-angle-expand"></i></button>
                            <button id="collapseAll" class="btn btn-sm btn-glass" title="Collapse"><i class="bi bi-arrows-angle-contract"></i></button>
                            <button id="downloadAll" class="btn btn-sm btn-glow py-1 px-3"><i class="bi bi-download"></i> All JSON</button>
                        </div>
                    </div>
                    
                    <div id="resultsContent"></div>
                    
                    <div class="text-center text-white small py-5">
                        <span class="opacity-50">Powered by Adamas Tech Consulting &copy; 2026</span>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            // --- State Management ---
            let selectedFiles = [];
            let pollingInterval = false;
            // NOTE: showConfidence boolean is no longer needed for rendering logic, only visual toggling
            let lastResults = null;
            window.LOCAL_FILE_URLS = {};

            // --- UI Interaction ---
            $("#browseButton").click(() => $("#fileInput").click());
            $("#fileInput").change((e) => handleFiles(e.target.files));

            // Drag & Drop
            const dropArea = document.getElementById('dropArea');
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(evt => {
                dropArea.addEventListener(evt, (e) => { e.preventDefault(); e.stopPropagation(); });
            });
            ['dragenter', 'dragover'].forEach(() => dropArea.classList.add('highlight'));
            ['dragleave', 'drop'].forEach(() => dropArea.classList.remove('highlight'));
            dropArea.addEventListener('drop', (e) => handleFiles(e.dataTransfer.files));

            function handleFiles(files) {
                const pdfFiles = Array.from(files).filter(file => file.type === 'application/pdf');
                if (pdfFiles.length === 0) { alert("Only PDF files are allowed."); return; }
                
                Object.values(window.LOCAL_FILE_URLS).forEach(url => URL.revokeObjectURL(url));
                window.LOCAL_FILE_URLS = {};
                
                pdfFiles.forEach(f => window.LOCAL_FILE_URLS[f.name] = URL.createObjectURL(f));
                selectedFiles = pdfFiles;
                renderFileList();
                $("#uploadButton").prop("disabled", false);
            }

            function renderFileList() {
                const $list = $("#fileList").empty();
                selectedFiles.forEach((file, idx) => {
                    const size = (file.size / 1024 / 1024).toFixed(2) + ' MB';
                    $list.append(`
                        <div class="file-item animate-fade-in">
                            <div class="d-flex align-items-center gap-3">
                                <i class="bi bi-file-earmark-pdf text-danger fs-5"></i>
                                <div><div class="text-white fw-medium">${file.name}</div><div class="small text-white">${size}</div></div>
                            </div>
                            <button class="btn btn-sm text-secondary hover-danger remove-file" data-idx="${idx}"><i class="bi bi-x-lg"></i></button>
                        </div>
                    `);
                });
                $(".remove-file").click(function() {
                    selectedFiles.splice($(this).data('idx'), 1);
                    renderFileList();
                    if(selectedFiles.length === 0) $("#uploadButton").prop("disabled", true);
                });
            }

            // --- Upload & Process ---
            $("#uploadButton").click(function() {
                if (selectedFiles.length === 0) return;
                const totalFiles = selectedFiles.length;
                const formData = new FormData();
                selectedFiles.forEach(f => formData.append("files", f));

                $("#uploadProgress").fadeIn();
                $("#statusTitle").text("Initializing Upload...");
                $("#statusPercent").text("0%");
                $("#mainProgressBar").css("width", "5%");
                
                $(this).prop("disabled", true).addClass('opacity-50');

                $.ajax({
                    url: "/upload", type: "POST", data: formData,
                    processData: false, contentType: false,
                    success: (res) => {
                        if(!res.success) { alert(res.msg); resetUI(); return; }
                        $("#jobId").text(res.job_id || res.payload);
                        $("#jobIdContainer").fadeIn();
                        
                        $("#statusTitle").text("AI Processing...");
                        $("#statusMessage").text("Extracting entities, validating totals...");
                        $("#mainProgressBar").css("width", "15%");
                        startPolling(res.payload, totalFiles);
                    },
                    error: () => {
                        $("#statusTitle").text("Upload Failed").addClass("text-danger");
                        resetUI();
                    }
                });
            });

            $("#copyJobId").click(function() {
                const text = $("#jobId").text();
                if (!text) return;
                navigator.clipboard.writeText(text).then(() => {
                    const $icon = $(this).find("i");
                    $icon.removeClass("bi-copy").addClass("bi-check-lg");
                    setTimeout(() => $icon.removeClass("bi-check-lg").addClass("bi-copy"), 2000);
                });
            });

            function startPolling(payload, totalFiles) {
                if (pollingInterval) clearInterval(pollingInterval);
                let fakeProgress = 15;

                const poll = () => {
                    const formData = new FormData();
                    formData.append("payload", payload);
                    $.ajax({
                        url: "/result", type: "POST", data: formData,
                        processData: false, contentType: false,
                        success: (res) => {
                            if (res.statusCode == 200) {
                                clearInterval(pollingInterval);
                                $("#statusTitle").text("Complete").removeClass("text-info").addClass("text-success");
                                $("#statusMessage").text("Rendered below.");
                                $("#statusPercent").text("100%");
                                $("#mainProgressBar").css("width", "100%").addClass("bg-success");
                                
                                lastResults = res;
                                renderResults(res);
                            } else {
                                if (res.completed_count !== undefined) {
                                    const pct = Math.round((res.completed_count / totalFiles) * 100);
                                    $("#mainProgressBar").css("width", pct + "%");
                                    $("#statusPercent").text(pct + "%");
                                } else {
                                    fakeProgress = Math.min(fakeProgress + 2, 90);
                                    $("#mainProgressBar").css("width", fakeProgress + "%");
                                    $("#statusPercent").text(fakeProgress + "%");
                                }
                            }
                        }
                    });
                };
                poll();
                pollingInterval = setInterval(poll, 3000);
            }

            // --- Results Rendering ---
            
            // CHANGED: Instead of re-rendering everything, just toggle a CSS class on the container
            $("#toggleConfidence").change(function() {
                const isChecked = $(this).is(':checked');
                // We toggle a class "show-scores" on the results container.
                // CSS handles the display:block/none of the score badges.
                $("#resultsContent").toggleClass("show-scores", isChecked);
            });

            function renderResults(res) {
                const $cont = $("#resultsContent").empty();
                $("#resultsContainer").fadeIn();
                $("#uploadButton").prop("disabled", false).removeClass('opacity-50');

                // Check toggle state on load to set initial class
                if ($("#toggleConfidence").is(':checked')) {
                    $cont.addClass("show-scores");
                } else {
                    $cont.removeClass("show-scores");
                }

                if (!res.data || res.data.length === 0) {
                    $cont.html('<div class="text-center text-white">No data found.</div>'); return;
                }

                res.data.forEach(item => {
                    let data = item.json_response;
                    if (typeof data === 'string') try { data = JSON.parse(data); delete data.overall_conf; } catch(e){}
                    
                    let fileUrl = item.file_url || window.LOCAL_FILE_URLS[item.filename] || "#";
                    let fileName = item.filename || "Unknown Document";
                    
                    const $card = $(`
                        <div class="result-card" data-filename="${fileName}">
                            <div class="result-header">
                                <div class="d-flex align-items-center gap-2 overflow-hidden">
                                    <button class="btn btn-sm btn-outline-secondary border-0 toggle-btn"><i class="bi bi-chevron-up"></i></button>
                                    <a href="${fileUrl}" target="_blank" class="text-info text-decoration-none fw-bold text-truncate" style="max-width: 250px;">
                                        ${fileName} <i class="bi bi-box-arrow-up-right small ms-1"></i>
                                    </a>
                                </div>
                                <div class="btn-group">
                                    <button class="btn btn-sm btn-glass text-white copy-json"><i class="bi bi-clipboard"></i></button>
                                    <button class="btn btn-sm btn-glass text-white download-json"><i class="bi bi-download"></i></button>
                                </div>
                            </div>
                            <div class="card-body p-4 collapse show"></div>
                        </div>
                    `);
                    
                    const $body = $card.find('.card-body');
                    $body.append(jsonToInputs(data));
                    
                    $card.find('.toggle-btn').click(function() {
                        const icon = $(this).find('i');
                        $body.slideToggle(200, () => icon.toggleClass('bi-chevron-up bi-chevron-down'));
                    });

                    const getCardData = () => {
                        let root = {};
                        $body.find('.json-field').each(function() {
                            const $el = $(this);
                            const path = $el.data('path'); 
                            const type = $el.data('type');
                            
                            let val = $el.val();
                            if (type === 'boolean') val = $el.is(':checked');
                            if (type === 'number') val = (val === '') ? null : parseFloat(val);
                            
                            const conf = $el.data('conf');
                            if (conf !== undefined) val = [val, String(conf)];
                            
                            const parts = path.split(/(?:\.|\[|\])+/).filter(p => p !== "");
                            let curr = root;
                            for (let i = 0; i < parts.length - 1; i++) {
                                let key = parts[i];
                                let nextKey = parts[i+1];
                                if (!curr[key]) curr[key] = isNaN(nextKey) ? {} : [];
                                curr = curr[key];
                            }
                            curr[parts[parts.length-1]] = val;
                        });
                        return root;
                    };
                    $card.data('getData', getCardData);

                    $card.find('.copy-json').click(() => {
                        navigator.clipboard.writeText(JSON.stringify(getCardData(), null, 2));
                        const btn = $card.find('.copy-json i').removeClass('bi-clipboard').addClass('bi-check2');
                        setTimeout(() => btn.removeClass('bi-check2').addClass('bi-clipboard'), 1000);
                    });

                    $card.find('.download-json').click(() => {
                        const blob = new Blob([JSON.stringify(getCardData(), null, 2)], {type: "application/json"});
                        const link = document.createElement("a");
                        link.href = URL.createObjectURL(blob);
                        link.download = fileName.split('.')[0] + ".json";
                        link.click();
                    });

                    $cont.append($card);
                });
            }

            function formatKey(str) {
                if (!str) return "";
                return str.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
            }

            function jsonToInputs(obj, path = "") {
                const $wrapper = $('<div class="ps-3"></div>');
                
                if (Array.isArray(obj)) {
                    obj.forEach((item, i) => {
                        const $group = $(`<div class="mb-3 p-3 rounded" style="background: rgba(255,255,255,0.02);"><div class="text-secondary small mb-2 fw-bold text-uppercase">Item ${i+1}</div></div>`);
                        $group.append(jsonToInputs(item, `${path}[${i}]`));
                        $wrapper.append($group);
                    });
                    return $wrapper;
                }
                
                if (typeof obj === 'object' && obj !== null) {
                    if (Object.keys(obj).length === 1 && obj.value !== undefined) {
                         return createFieldInput(path.split('.').pop(), obj.value, path);
                    }
                    Object.entries(obj).forEach(([key, val]) => {
                        const currentPath = path ? `${path}.${key}` : key;
                        if (val && typeof val === 'object' && !Array.isArray(val) && val.hasOwnProperty('value')) {
                            let rawVal = val.value;
                            let confVal = undefined;
                            if (Array.isArray(rawVal) && rawVal.length === 2) { confVal = rawVal[1]; rawVal = rawVal[0]; }
                            $wrapper.append(createFieldInput(key, rawVal, currentPath, confVal));
                        } 
                        else if (typeof val === 'object' && val !== null) {
                            $wrapper.append(`<div class="text-info small fw-bold mt-2 mb-1 text-uppercase">${formatKey(key)}</div>`);
                            $wrapper.append(jsonToInputs(val, currentPath));
                        } else {
                            $wrapper.append(createFieldInput(key, val, currentPath));
                        }
                    });
                    return $wrapper;
                }
                return $wrapper;
            }

            function createFieldInput(label, val, path, conf) {
                const displayLabel = formatKey(label);

                const $row = $('<div class="mb-3 row align-items-center g-2"></div>');
                const type = (typeof val === 'number') ? 'number' : (typeof val === 'boolean') ? 'checkbox' : 'text';
                
                $row.append(`<div class="col-12 col-md-4 text-white small text-truncate" title="${displayLabel}">${displayLabel}</div>`);
                
                const $colInput = $('<div class="col"></div>');
                let $input;
                if (type === 'checkbox') {
                    $input = $(`<div class="form-check form-switch"><input class="form-check-input json-field" type="checkbox" ${val ? 'checked' : ''}></div>`);
                    $input.find('input').data({path, type: 'boolean', conf});
                } else {
                    $input = $(`<input type="${type}" class="form-control form-control-dark json-field" value="${val === null ? '' : val}">`);
                    $input.data({path, type: (val===null?'null':type), conf});
                }
                $colInput.append($input);
                $row.append($colInput);

                // CHANGED: Always append the confidence score if it exists.
                // We add the class 'conf-score' which is hidden by default in CSS.
                // It is only revealed when the parent container has the class 'show-scores'.
                if (conf !== undefined) {
                    const cNum = parseFloat(conf);
                    if (!isNaN(cNum) && cNum > 0) {
                        const color = cNum > 0.9 ? 'text-success' : (cNum > 0.7 ? 'text-warning' : 'text-danger');
                        $row.append(`<div class="col-auto conf-score"><span class="small fw-bold ${color}">${Math.round(cNum*100)}%</span></div>`);
                    }
                }
                return $row;
            }

            $("#expandAll").click(() => $(".result-card .card-body").slideDown());
            $("#collapseAll").click(() => $(".result-card .card-body").slideUp());
            
            $("#downloadAll").click(function() {
                const masterData = {};
                $(".result-card").each(function() {
                    const fname = $(this).data('filename');
                    if ($(this).data('getData')) {
                        masterData[fname] = $(this).data('getData')();
                    }
                });
                
                const blob = new Blob([JSON.stringify(masterData, null, 2)], {type: "application/json"});
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = "all_invoices_data.json";
                link.click();
            });

            function resetUI() {
                $("#uploadButton").prop("disabled", false).removeClass('opacity-50');
            }
        });
    </script>
</body>
</html>
